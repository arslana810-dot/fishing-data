name: Depth data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = quick check, build = make all depth tiles"
        required: true
        default: "probe"
        type: choice
        options:
          - probe
          - build

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free disk space (the official GEBCO file is large)
        if: ${{ inputs.mode == 'build' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install
        run: pip install rasterio numpy netCDF4

      - name: Run (${{ inputs.mode }})
        run: python scripts/depth_job.py ${{ inputs.mode }}

      - name: Save depth tiles to the repository
        if: ${{ inputs.mode == 'build' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/depth
          git commit -m "Depth tiles from GEBCO 2026" || true
          git pull --rebase
          git push

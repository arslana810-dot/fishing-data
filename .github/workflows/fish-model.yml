name: Fish model

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install
        run: pip install "tensorflow-cpu>=2.16,<2.20" numpy

      - name: Collect photos (iNaturalist, CC0 / CC-BY)
        run: python scripts/train_fish_id.py collect

      - name: Train and test
        run: python scripts/train_fish_id.py train

      - name: Save the model to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/models
          git commit -m "Fish identification model v2" || true
          git pull --rebase
          git push
